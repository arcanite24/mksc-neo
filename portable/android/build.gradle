// Android shell for the native game: SDL's Java activity plus libmksc.so.
// Build outputs stay under .mksc-tools/portable/check/android/.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    layout.buildDirectory = rootProject.file("../../.mksc-tools/portable/check/android/${project.name}")
}
